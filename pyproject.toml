[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-agent"
version = "0.1.0"
description = "A minimal, extensible command-line Agent powered by DeepSeek."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
deepseek-agent = "deepseek_agent.cli:main"
deepseek-agent-gui = "deepseek_agent.gui_app:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deepseek_agent = ["prompts/*.md"]
