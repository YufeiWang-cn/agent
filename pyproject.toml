[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-agent"
version = "0.1.0"
description = "A minimal, extensible command-line Agent powered by DeepSeek."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.6,<8",
    "mypy>=1.11,<2",
    "ruff>=0.8,<1",
]

[project.scripts]
deepseek-agent = "deepseek_agent.cli:main"
deepseek-agent-gui = "deepseek_agent.gui_app:main"
deepseek-agent-eval = "deepseek_agent.evaluation.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deepseek_agent = ["prompts/*.md"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"src/deepseek_agent/**/__init__.py" = ["F401"]
"src/deepseek_agent/ui/cards.py" = ["F401"]
"tests/*.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
files = ["src/deepseek_agent"]
exclude = ["^src/deepseek_agent/ui/"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["deepseek_agent"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
