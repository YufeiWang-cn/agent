name: 测试

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  test:
    name: Python
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: 获取代码
        uses: actions/checkout@v7

      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip

      - name: 安装项目
        run: python -m pip install -e .

      - name: 运行测试
        run: python -m unittest discover -s tests -v
